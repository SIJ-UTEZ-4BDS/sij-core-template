<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Administración de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
    <link href="../../assets/css/modulo.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar-judicial">
        <div class="sidebar-brand-banner">
            <i class="bi bi-bank2 fs-3"></i>
            <h5 class="mb-0 fw-bold mt-1">SIJ MORELOS</h5>
            <small class="text-thin" id="sidebar-subtitle">Control Institucional</small>
        </div>
        <nav class="mt-3">
            <a href="index.html" class="nav-link active">
                <i class="bi bi-people-fill"></i>
                <span>Consulta de Usuarios</span>
            </a>
            <a href="../dashboard/index.html" class="nav-link d-none" id="link-bandeja-modulo">
                <i class="bi bi-folder2-open"></i>
                <span>Bandeja Operativa</span>
            </a>
            <a href="../../api/auth/logout" class="nav-link mt-4">
                <i class="bi bi-box-arrow-left"></i>
                <span>Cerrar Sesión</span>
            </a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar-judicial">
            <div>
                <span class="fw-semibold" id="panel-title">Administración de Usuarios y Permisos</span>
                <small class="ms-2" id="juzgado-context"></small>
            </div>
            <span class="badge-sesion-global small" id="user-badge">Cargando...</span>
        </header>

        <main class="p-4">
            <div class="row g-4">
                <!-- Alta / Edición -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h6 class="fw-bold mb-3 d-flex align-items-center gap-2">
                                <i class="bi bi-person-plus-fill" style="color: var(--dorado);"></i>
                                <span id="form-title">Alta de Servidor Público</span>
                            </h6>
                            <div id="alert-admin" class="alert d-none small py-2"></div>

                            <form id="form-user">
                                <input type="hidden" name="accion" id="input-accion" value="crear">
                                <input type="hidden" name="idUsuario" id="input-id-usuario" value="">

                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Nombre Completo</label>
                                    <input type="text" class="form-control form-control-sm" name="nombreCompleto" id="input-nombre" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Correo Institucional</label>
                                    <input type="email" class="form-control form-control-sm" name="correo" id="input-correo" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold" id="label-password">Contraseña Inicial</label>
                                    <input type="password" class="form-control form-control-sm" name="password" id="input-password" required>
                                    <small class="d-none" id="help-password">Opcional al editar.</small>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Rol Asignado</label>
                                    <select class="form-select form-select-sm" name="rol" id="select-rol" required></select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Distrito / Juzgado</label>
                                    <select class="form-select form-select-sm" name="idJuzgado" id="select-juzgado" required></select>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-institucional btn-sm py-2" id="btn-submit">
                                        <i class="bi bi-check2-circle me-1"></i> Guardar Registro
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="btn-cancel-edit" onclick="resetFormMode()">
                                        Cancelar Edición
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta Única de Consulta General -->
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                                <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
                                    <i class="bi bi-card-list" style="color: var(--dorado);"></i>
                                    <span id="table-title">Tarjeta de Consulta General</span>
                                </h6>
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control form-control-sm" style="width: 220px;" id="search-user" placeholder="Buscar clave o nombre..." oninput="renderFilteredUsers()">
                                    <button class="btn-icon-action icon-dorado" onclick="loadUsers()" title="Actualizar consulta">
                                        <i class="bi bi-arrow-clockwise"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>Clave</th>
                                        <th>Servidor Público</th>
                                        <th>Rol</th>
                                        <th>Distrito / Juzgado</th>
                                        <th class="text-center">Estatus</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                    </thead>
                                    <tbody id="users-table">
                                    <tr>
                                        <td><span class="skeleton"></span></td>
                                        <td><span class="skeleton"></span></td>
                                        <td><span class="skeleton"></span></td>
                                        <td><span class="skeleton"></span></td>
                                        <td><span class="skeleton"></span></td>
                                        <td><span class="skeleton"></span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    let currentUsers = [];

    async function loadUsers() {
        const res = await fetch('../../api/admin/users');
        if (res.status === 401 || res.status === 403) {
            window.location.href = '../../index.html';
            return;
        }
        const data = await res.json();
        if (!data.ok) return;

        currentUsers = data.usuarios || [];

        document.getElementById('user-badge').textContent = `${data.miNombre} • ${data.miClave}`;
        document.getElementById('juzgado-context').textContent = `| ${data.miJuzgado}`;

        const linkBandeja = document.getElementById('link-bandeja-modulo');
        if (data.esSuperAdmin) {
            document.getElementById('sidebar-subtitle').textContent = 'Consola Raíz';
            document.getElementById('table-title').textContent = 'Consulta General de Administradores';
            linkBandeja.classList.add('d-none');
        } else {
            document.getElementById('sidebar-subtitle').textContent = 'Administración Juzgado';
            document.getElementById('table-title').textContent = 'Consulta General de Usuarios del Juzgado';
            linkBandeja.classList.remove('d-none');
        }

        document.getElementById('select-rol').innerHTML = (data.rolesPermitidos || []).map(r =>
            `<option value="${r.codigo}">${r.etiqueta}</option>`
        ).join('');

        document.getElementById('select-juzgado').innerHTML = (data.juzgadosPermitidos || []).map(j =>
            `<option value="${j.idJuzgado}">${j.descripcion}</option>`
        ).join('');

        renderFilteredUsers();
    }

    function renderFilteredUsers() {
        const q = (document.getElementById('search-user').value || '').toLowerCase().trim();
        const filtered = currentUsers.filter(u =>
            u.claveEmpleado.toLowerCase().includes(q) ||
            u.nombreCompleto.toLowerCase().includes(q) ||
            u.correo.toLowerCase().includes(q)
        );

        const tbody = document.getElementById('users-table');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3">Sin registros en este juzgado.</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(u => `
            <tr class="${u.activo ? '' : 'opacity-75'}">
                <td class="fw-bold small">${u.claveEmpleado}</td>
                <td>
                    <span class="fw-semibold">${u.nombreCompleto}</span><br>
                    <small>${u.correo}</small>
                </td>
                <td><span class="badge badge-rol-global">${u.rol}</span></td>
                <td><small>${u.juzgado}</small></td>
                <td class="text-center">
                    <span class="badge badge-rol-global">
                        ${u.activo ? 'Activo' : 'Inactivo'}
                    </span>
                </td>
                <td class="text-center">
                    <div class="d-inline-flex gap-1">
                        <button onclick="startEdit(${u.idUsuario})" class="btn-icon-action icon-dorado" title="Editar datos">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button onclick="toggleUser(${u.idUsuario})" class="btn-icon-action" title="${u.activo ? 'Desactivar cuenta (Conservar datos)' : 'Activar cuenta'}">
                            <i class="bi ${u.activo ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                        </button>
                        ${u.bloqueado ? `
                        <button onclick="unlockUser(${u.idUsuario})" class="btn-icon-action icon-dorado" title="Desbloquear cuenta">
                            <i class="bi bi-unlock-fill"></i>
                        </button>` : ''}
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function startEdit(idUsuario) {
        const u = currentUsers.find(item => item.idUsuario === idUsuario);
        if (!u) return;

        document.getElementById('form-title').textContent = `Editar: ${u.claveEmpleado}`;
        document.getElementById('input-accion').value = 'editar';
        document.getElementById('input-id-usuario').value = u.idUsuario;
        document.getElementById('input-nombre').value = u.nombreCompleto;
        document.getElementById('input-correo').value = u.correo;
        document.getElementById('select-rol').value = u.rol;
        if (u.idJuzgado) {
            document.getElementById('select-juzgado').value = u.idJuzgado;
        }

        const passInput = document.getElementById('input-password');
        passInput.value = '';
        passInput.required = false;
        document.getElementById('label-password').textContent = 'Nueva Contraseña (Opcional)';
        document.getElementById('help-password').classList.remove('d-none');

        document.getElementById('btn-submit').innerHTML = '<i class="bi bi-save me-1"></i> Actualizar Datos';
        document.getElementById('btn-cancel-edit').classList.remove('d-none');
    }

    function resetFormMode() {
        document.getElementById('form-user').reset();
        document.getElementById('form-title').textContent = 'Alta de Servidor Público';
        document.getElementById('input-accion').value = 'crear';
        document.getElementById('input-id-usuario').value = '';

        const passInput = document.getElementById('input-password');
        passInput.required = true;
        document.getElementById('label-password').textContent = 'Contraseña Inicial';
        document.getElementById('help-password').classList.add('d-none');

        document.getElementById('btn-submit').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Guardar Registro';
        document.getElementById('btn-cancel-edit').classList.add('d-none');
    }

    async function toggleUser(idUsuario) {
        const params = new URLSearchParams({ accion: 'toggle', idUsuario });
        const res = await fetch('../../api/admin/users', { method: 'POST', body: params });
        const data = await res.json();
        showAlert(data.ok, data.mensaje);
        loadUsers();
    }

    async function unlockUser(idUsuario) {
        const params = new URLSearchParams({ accion: 'desbloquear', idUsuario });
        const res = await fetch('../../api/admin/users', { method: 'POST', body: params });
        const data = await res.json();
        showAlert(data.ok, data.mensaje);
        loadUsers();
    }

    function showAlert(ok, msg) {
        const alertBox = document.getElementById('alert-admin');
        alertBox.className = `alert small py-2 ${ok ? 'alert-success' : 'alert-danger'}`;
        alertBox.textContent = msg;
    }

    document.getElementById('form-user').addEventListener('submit', async (e) => {
        e.preventDefault();
        const params = new URLSearchParams(new FormData(e.target));
        const res = await fetch('../../api/admin/users', { method: 'POST', body: params });
        const data = await res.json();

        showAlert(data.ok, data.mensaje);
        if (data.ok) {
            resetFormMode();
            loadUsers();
        }
    });

    loadUsers();
</script>
</body>
</html>
