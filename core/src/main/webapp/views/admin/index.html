<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Administración de Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
    <link href="../../assets/css/modulo.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar-judicial">
        <div class="p-3 text-center border-bottom border-secondary">
            <h5 class="mb-0 fw-bold">SIJ MORELOS</h5>
            <small class="text-white-50">Panel Administrador</small>
        </div>
        <nav class="mt-3">
            <a href="index.html" class="nav-link active">Gestión de Personal</a>
            <a href="../dashboard/index.html" class="nav-link">Ir a Bandeja Operativa</a>
            <a href="../../api/auth/logout" class="nav-link text-warning mt-4">Cerrar Sesión</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar-judicial">
            <span class="fw-semibold">Administración de Servidores Públicos y Roles</span>
            <span class="badge bg-secondary" id="user-badge">Admin</span>
        </header>

        <main class="p-4">
            <div class="row g-4">
                <!-- Formulario de Alta -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Registrar Servidor Público</h5>
                            <div id="alert-admin" class="alert d-none small py-2"></div>
                            <form id="form-user">
                                <div class="mb-2">
                                    <label class="form-label small">Nombre Completo</label>
                                    <input type="text" class="form-control form-control-sm" name="nombreCompleto" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Correo Institucional</label>
                                    <input type="email" class="form-control form-control-sm" name="correo" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Contraseña Inicial</label>
                                    <input type="password" class="form-control form-control-sm" name="password" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Rol del Sistema</label>
                                    <select class="form-select form-select-sm" name="rol" required>
                                        <option value="OPERADOR_OFICIALIA">Operador de Oficialía</option>
                                        <option value="ADMIN_OFICIALIA">Admin de Oficialía</option>
                                        <option value="JUEZ_AUDIENCIA">Encargado de Audiencias</option>
                                        <option value="MAGISTRADO_TOCAS">Magistrado (Tocas)</option>
                                        <option value="PERITO">Perito Judicial</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small">Juzgado de Adscripción</label>
                                    <select class="form-select form-select-sm" name="idJuzgado" required>
                                        <option value="1">J01 - Juzgado Primero Familiar (Cuernavaca)</option>
                                        <option value="2">J02 - Juzgado Segundo Violencia (Xochitepec)</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-institucional w-100 btn-sm py-2">Generar Clave y Guardar</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Empleados -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Padrón de Personal Activo</h5>
                            <table class="table table-sm align-middle">
                                <thead>
                                <tr>
                                    <th>Clave Generada</th>
                                    <th>Nombre / Correo</th>
                                    <th>Rol</th>
                                    <th>Juzgado</th>
                                    <th>Estado</th>
                                </tr>
                                </thead>
                                <tbody id="users-table">
                                <tr>
                                    <td><span class="skeleton"></span></td>
                                    <td><span class="skeleton"></span></td>
                                    <td><span class="skeleton"></span></td>
                                    <td><span class="skeleton"></span></td>
                                    <td><span class="skeleton"></span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.getElementById('user-badge').textContent = sessionStorage.getItem('claveEmpleado') || 'Admin';

    async function loadUsers() {
        const res = await fetch('../../api/admin/users');
        const list = await res.json();
        const tbody = document.getElementById('users-table');
        tbody.innerHTML = list.map(u => `
            <tr>
                <td class="fw-bold">${u.claveEmpleado}</td>
                <td>${u.nombreCompleto}<br><small class="text-muted">${u.correo}</small></td>
                <td><span class="badge bg-dark">${u.rol}</span></td>
                <td><small>${u.juzgado}</small></td>
                <td>
                    <button onclick="toggleUser(${u.idUsuario})" class="btn btn-sm ${u.activo ? 'btn-outline-success' : 'btn-outline-danger'}">
                        ${u.activo ? 'Activo' : 'Inactivo'}
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function toggleUser(idUsuario) {
        const params = new URLSearchParams({ accion: 'toggle', idUsuario });
        await fetch('../../api/admin/users', { method: 'POST', body: params });
        loadUsers();
    }

    document.getElementById('form-user').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-admin');
        const params = new URLSearchParams(new FormData(e.target));
        const res = await fetch('../../api/admin/users', { method: 'POST', body: params });
        const data = await res.json();

        alertBox.className = `alert small py-2 ${data.ok ? 'alert-success' : 'alert-danger'}`;
        alertBox.textContent = data.mensaje;
        if (data.ok) {
            e.target.reset();
            loadUsers();
        }
    });

    loadUsers();
</script>
</body>
</html>
