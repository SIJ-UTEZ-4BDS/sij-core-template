<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Bandeja Operativa del Módulo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
    <link href="../../assets/css/modulo.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar-judicial">
        <div class="p-3 text-center border-bottom border-secondary">
            <h5 class="mb-0 fw-bold">SIJ MORELOS</h5>
            <small class="text-white-50" id="sidebar-module-name">Panel Operativo</small>
        </div>
        <nav class="mt-3">
            <a href="index.html" class="nav-link active">Bandeja Principal</a>
            <a href="../admin/index.html" class="nav-link d-none" id="link-volver-admin">Gestión de Personal de mi Módulo</a>
            <a href="../../api/auth/logout" class="nav-link text-warning mt-4">Cerrar Sesión</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar-judicial">
            <div>
                <span class="fw-semibold">Sistema Integral de Gestión Judicial</span>
                <small class="text-muted ms-2" id="user-juzgado"></small>
            </div>
            <span class="badge bg-secondary" id="user-badge">Verificando sesión...</span>
        </header>

        <!-- ZONA DE TRABAJO DEL MÓDULO (Cada uno de los 4 equipos desarrolla su módulo dentro de <main>) -->
        <main class="p-4" id="module-workspace">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h4 class="mb-0" id="workspace-title">Bandeja Operativa del Módulo</h4>
                    <small class="text-muted" id="workspace-subtitle">Plantilla base del Core lista para cada módulo</small>
                </div>
                <button class="btn btn-institucional">+ Nuevo Registro del Módulo</button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Folio / Expediente</th>
                            <th>Materia</th>
                            <th>Distrito / Juzgado</th>
                            <th>Estatus</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                        <tr>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    async function initDashboardSession() {
        const res = await fetch('../../api/auth/session');
        if (!res.ok) {
            window.location.href = '../../index.html';
            return;
        }
        const s = await res.json();
        document.getElementById('user-badge').textContent = `${s.nombreCompleto} (${s.claveEmpleado} | ${s.rol})`;
        document.getElementById('user-juzgado').textContent = `• ${s.nombreJuzgado}`;
        document.getElementById('workspace-subtitle').textContent = `Adscripción activa: ${s.nombreJuzgado} — Rol: ${s.rol}`;

        if (s.rol && s.rol.startsWith('ADMIN_')) {
            document.getElementById('link-volver-admin').classList.remove('d-none');
        }
    }
    initDashboardSession();
</script>
</body>
</html>
