<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
    <link href="../../assets/css/modulo.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar-judicial">
        <div class="p-3 text-center border-bottom border-secondary">
            <h5 class="mb-0 fw-bold">SIJ MORELOS</h5>
            <small class="text-white-50">Panel Operativo</small>
        </div>
        <nav class="mt-3">
            <a href="index.html" class="nav-link active">Dashboard</a>
            <a href="../../api/auth/logout" class="nav-link text-warning mt-4">Cerrar Sesión</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar-judicial">
            <span class="fw-semibold">Sistema Integral de Gestión Judicial</span>
            <span class="badge bg-secondary" id="user-badge">Servidor Público</span>
        </header>

        <!-- ZONA DE TRABAJO DEL MÓDULO (Cada equipo edita únicamente dentro de <main>) -->
        <main class="p-4" id="module-workspace">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Registros del Módulo</h4>
                <button class="btn btn-institucional">+ Nuevo Trámite</button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Folio / Expediente</th>
                            <th>Materia</th>
                            <th>Distrito / Juzgado</th>
                            <th>Estatus</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                        <tr>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                            <td><span class="skeleton"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    const nombre = sessionStorage.getItem('nombreCompleto') || 'Usuario';
    const clave = sessionStorage.getItem('claveEmpleado') || '';
    document.getElementById('user-badge').textContent = `${nombre} (${clave})`;
</script>
</body>
</html>
