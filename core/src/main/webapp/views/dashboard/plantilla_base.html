<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Panel de Módulo Judicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css" rel="stylesheet">
    <link href="../../assets/css/modulo.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <!-- Menú Lateral Institucional Genérico -->
    <aside class="sidebar-judicial">
        <div class="p-3 text-center border-bottom border-secondary">
            <h5 class="mb-0 fw-bold">SIJ MORELOS</h5>
            <small class="text-white-50" id="nombre-modulo-sidebar">Módulo Judicial</small>
        </div>
        <nav class="mt-3">
            <a href="#" class="nav-link active">Bandeja Principal</a>
            <a href="#" class="nav-link">Gestión de Catálogos</a>
            <a href="#" class="nav-link">Historial de Auditoría</a>
            <a href="#" class="nav-link">Personalización Visual</a>
        </nav>
    </aside>

    <!-- Contenedor Principal -->
    <div class="main-content">
        <header class="topbar-judicial">
            <span class="fw-semibold">Sistema Integral de Gestión Judicial del Estado de Morelos</span>
            <span class="badge bg-secondary" id="badge-rol-usuario">Sesión Activa</span>
        </header>

        <main class="p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Bandeja de Registros del Módulo</h4>
                <button class="btn btn-institucional">+ Nuevo Registro</button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Folio / Expediente</th>
                                <th>Materia</th>
                                <th>Distrito / Juzgado</th>
                                <th>Fecha</th>
                                <th>Estatus</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-registros">
                            <!-- Filas Skeleton mientras el fetch() espera respuesta del Servlet -->
                            <tr>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                            </tr>
                            <tr>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
