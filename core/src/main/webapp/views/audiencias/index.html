<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Bandeja Operativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
    <link href="../../assets/css/modulo.css?v=3" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar-judicial">
        <div class="sidebar-brand-banner">
            <i class="bi bi-bank2 fs-3"></i>
            <h5 class="mb-0 fw-bold mt-1">SIJ MORELOS</h5>
            <small class="text-thin" id="sidebar-module-name">Módulo Jurisdiccional</small>
        </div>
        <nav class="mt-3">
            <a href="index.html" class="nav-link active">
                <i class="bi bi-inboxes-fill"></i>
                <span>Consulta General</span>
            </a>
            <a href="../admin/index.html" class="nav-link d-none" id="link-volver-admin">
                <i class="bi bi-people-fill"></i>
                <span>Personal del Juzgado</span>
            </a>
            <a href="../../api/auth/logout" class="nav-link mt-4">
                <i class="bi bi-box-arrow-left"></i>
                <span>Cerrar Sesión</span>
            </a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar-judicial">
            <div>
                <span class="fw-semibold">Sistema Integral de Gestión Judicial</span>
                <small class="ms-2" id="user-juzgado"></small>
            </div>
            <span class="badge-sesion-global small" id="user-badge">Verificando sesión...</span>
        </header>

        <!-- ZONA DE TRABAJO DEL MÓDULO (Cada equipo trabaja dentro de <main> en su carpeta de módulo) -->
        <main class="p-4" id="module-workspace">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
                            <i class="bi bi-folder2-open" style="color: var(--dorado);"></i>
                            <span>Tarjeta de Consulta General</span>
                        </h6>
                        <button class="btn btn-institucional btn-sm px-3">
                            <i class="bi bi-plus-lg me-1"></i> Nuevo Registro
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Folio / Expediente</th>
                                <th>Materia</th>
                                <th>Distrito / Juzgado</th>
                                <th>Estatus</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="table-body">
                            <tr>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                                <td><span class="skeleton"></span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    async function initDashboardSession() {
        const res = await fetch('../../api/auth/session');
        if (res.status === 401) {
            window.location.href = '../../index.html';
            return;
        }
        const s = await res.json();
        if (!s.ok) return;

        document.getElementById('user-badge').textContent = `${s.nombreCompleto} • ${s.claveEmpleado}`;
        document.getElementById('user-juzgado').textContent = `| ${s.nombreJuzgado}`;

        const rol = s.rol || '';
        const modTitle = document.getElementById('sidebar-module-name');
        if (rol.includes('OFICIALIA')) modTitle.textContent = 'Oficialía de Partes';
        else if (rol.includes('AUDIENCIA') || rol.includes('SALA')) modTitle.textContent = 'Gestión de Audiencias';
        else if (rol.includes('PERITO')) modTitle.textContent = 'Coordinación de Peritos';
        else if (rol.includes('TOCA') || rol.includes('MAGISTRADO')) modTitle.textContent = 'Segunda Instancia (Tocas)';

        if (rol.startsWith('ADMIN_')) {
            document.getElementById('link-volver-admin').classList.remove('d-none');
        }
    }
    initDashboardSession();
</script>
</body>
</html>
