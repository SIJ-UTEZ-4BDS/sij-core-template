<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Acceso Institucional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/layout.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="card shadow border-0 p-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
        <h4 class="fw-bold" style="color: var(--color-primario);">SIJ MORELOS</h4>
        <p class="text-muted small mb-0">Sistema Integral de Gestión Judicial</p>
    </div>

    <div id="alert-login" class="alert d-none small py-2" role="alert"></div>

    <form id="form-login">
        <div class="mb-3">
            <label class="form-label">Clave de Empleado o Correo</label>
            <input type="text" class="form-control" name="usuario" placeholder="Ej. ROOT-SIJ-26-0001" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-institucional w-100 py-2">Iniciar Sesión</button>
    </form>
</div>

<script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-login');
        const params = new URLSearchParams(new FormData(e.target));

        const res = await fetch('api/auth/login', { method: 'POST', body: params });
        const data = await res.json();

        if (data.ok) {
            sessionStorage.setItem('claveEmpleado', data.claveEmpleado);
            sessionStorage.setItem('nombreCompleto', data.nombreCompleto);
            sessionStorage.setItem('rol', data.rol);
            window.location.href = data.redirectUrl;
        } else {
            alertBox.className = 'alert alert-danger small py-2';
            alertBox.textContent = data.mensaje;
        }
    });
</script>
</body>
</html>
