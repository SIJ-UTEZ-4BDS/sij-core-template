<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJ Morelos - Acceso Institucional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/layout.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-sm overflow-hidden" style="max-width: 410px; width: 100%;">
    <div class="sidebar-brand-banner py-4">
        <i class="bi bi-bank2 fs-2"></i>
        <h4 class="fw-bold mb-0 mt-1" style="color: #ffffff;">SIJ MORELOS</h4>
        <small class="text-thin">Sistema Integral de Gestión Judicial</small>
    </div>
    <div class="card-body p-4">
        <div id="alert-login" class="alert d-none small py-2"></div>
        <form id="form-login">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Clave de Empleado o Correo</label>
                <input type="text" class="form-control" name="usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-institucional w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-login');
        const params = new URLSearchParams(new FormData(e.target));

        const res = await fetch('api/auth/login', { method: 'POST', body: params });
        const data = await res.json();

        if (data.ok) {
            sessionStorage.setItem('claveEmpleado', data.claveEmpleado || '');
            sessionStorage.setItem('nombreCompleto', data.nombreCompleto || '');
            sessionStorage.setItem('rol', data.rol || '');
            window.location.href = data.redirect || 'views/dashboard/index.html';
        } else {
            alertBox.className = 'alert alert-danger small py-2';
            alertBox.textContent = data.mensaje || 'Error al iniciar sesión.';
        }
    });
</script>
</body>
</html>
